# GapGuard 4.2.0-rc1 - extraits de la configuration Giga de reference.
# Lire docs/INSTALLATION.md et docs/CONFIGURATION.md avant integration.
# Ne pas dupliquer les sections existantes. Ce fichier seul ne configure pas une Giga.

[gapguard]
auto_recovery_enabled: 1
auto_recovery_delay: 30.0
auto_recovery_distance: 300.0
auto_recovery_chunk: 20.0
# PD3 AutoRecovery : cumul de tous les blocs sur les 300 mm, sans fenêtre glissante.
auto_recovery_min_transitions: 2
auto_recovery_feedrate: 200
# Trace détaillée du capteur de mouvement PD3 dans klippy.log.
# 0 = désactivée
# 1 = activée
# Utilisée pendant les tests pour mesurer les fronts HIGH/LOW,
# les distances et temps entre fronts, ainsi que SUSPECT/VERIFY.
motion_trace: 1
motion_pin: PD3
presence_pin: PD4
extruder: extruder
default_mode: FULL
# PD3 : distances en mm E natif depuis la reference ; calibration conservee : 9 / 20 / 20 / 2.
# Fenetre fixe : reference + 20 a reference + 40 mm ; 2 fronts reels requis.
suspect_distance: 9.0
verify_trigger: 20.0
verify_distance: 20.0
verify_transitions: 2
check_interval: 0.250
init_guard: 0.250

[gcode_macro GAPGUARD_PAUSE]
description: GapGuard - Pause Elegoo avec coupure de consigne buse
gcode:
    GAPGUARD_INTERNAL_PAUSE {rawparams}

[gcode_macro GAPGUARD_STATUS]
description: GapGuard - Afficher l’état et les protections
gcode:
    GAPGUARD_INTERNAL_STATUS {rawparams}

[gcode_macro GAPGUARD_ENABLE_FULL]
description: GapGuard - Activer FULL : présence et mouvement
gcode:
    GAPGUARD_INTERNAL_ENABLE_FULL {rawparams}

[gcode_macro GAPGUARD_ENABLE_PARTIAL]
description: GapGuard - Activer PARTIAL : présence seule
gcode:
    GAPGUARD_INTERNAL_ENABLE_PARTIAL {rawparams}

[gcode_macro GAPGUARD_DISABLE_ALL]
description: GapGuard - Activer BYPASS : désactiver les protections filament
gcode:
    GAPGUARD_INTERNAL_DISABLE_ALL {rawparams}

[gcode_macro GAPGUARD_STATUS_DEBUG]
description: GapGuard - Diagnostic technique lisible (RAW=1 ajoute le JSON)
gcode:
    GAPGUARD_INTERNAL_STATUS_DEBUG {rawparams}

[idle_timeout]
timeout: 7200
gcode:
  {% if printer.gapguard.pause_origin == "gapguard" %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% elif printer[printer.toolhead.extruder].temperature > 160 %}
  {action_respond_info("Extruder powered down on idle timeout.")}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={140}
  SET_IDLE_TIMEOUT TIMEOUT=259200
  {% else %}
  TURN_OFF_HEATERS
  {% endif %}
