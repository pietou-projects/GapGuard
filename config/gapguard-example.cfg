# GapGuard 4.2.1-rc1 — add or merge into the matching Elegoo configuration.
# This is not a complete printer.cfg. Keep the native macros and calibration.
# Do not duplicate existing sections. See docs/ORANGESTORM-GIGA-REFERENCE.md.
# PD3 motion and PD4 presence must have no other owner.
# Normal detection: 9 mm suspicion, 20 mm trigger, 20 mm verification, 2 edges.
# AutoRecovery: 30 seconds, 300 mm in 15 blocks of 20 mm at F200 (mm/min).
# Require 2 real PD3 transitions across the entire purge; always finish 300 mm.
# motion_trace=1 writes detailed PD3 records to klippy.log; 0 disables that trace.

[gapguard]
auto_recovery_enabled: 1
auto_recovery_delay: 30.0
auto_recovery_distance: 300.0
auto_recovery_chunk: 20.0
auto_recovery_min_transitions: 2
auto_recovery_feedrate: 200
motion_trace: 1
motion_pin: PD3
presence_pin: PD4
extruder: extruder
default_mode: FULL
suspect_distance: 9.0
verify_trigger: 20.0
verify_distance: 20.0
verify_transitions: 2
check_interval: 0.250
init_guard: 0.250

[gcode_macro GAPGUARD_PAUSE]
description: GapGuard - Elegoo pause with hotend target set to zero
gcode:
    GAPGUARD_INTERNAL_PAUSE {rawparams}

[gcode_macro GAPGUARD_STATUS]
description: GapGuard - Show status and protections
gcode:
    GAPGUARD_INTERNAL_STATUS {rawparams}

[gcode_macro GAPGUARD_STATUS_DEBUG]
description: GapGuard - Readable diagnostics (RAW=1 also returns JSON)
gcode:
    GAPGUARD_INTERNAL_STATUS_DEBUG {rawparams}

[gcode_macro GAPGUARD_ENABLE_FULL]
description: GapGuard - Enable FULL: presence and motion
gcode:
    GAPGUARD_INTERNAL_ENABLE_FULL {rawparams}

[gcode_macro GAPGUARD_ENABLE_PARTIAL]
description: GapGuard - Enable PARTIAL: presence only
gcode:
    GAPGUARD_INTERNAL_ENABLE_PARTIAL {rawparams}

[gcode_macro GAPGUARD_DISABLE_ALL]
description: GapGuard - Enable BYPASS: disable filament protections
gcode:
    GAPGUARD_INTERNAL_DISABLE_ALL {rawparams}

[idle_timeout]
timeout: 7200
gcode:
  {% if printer.gapguard.pause_origin == "gapguard" %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% elif printer[printer.toolhead.extruder].temperature > 160 %}
  {action_respond_info("Extruder powered down on idle timeout.")}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={140}
  SET_IDLE_TIMEOUT TIMEOUT=259200
  {% else %}
  TURN_OFF_HEATERS
  {% endif %}
